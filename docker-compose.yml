services:
  backend:
    build: ./backend
    environment:
      - DATABASE_URL=sqlite:///./data/poker.db
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - CORS_ORIGINS=http://localhost
    volumes:
      - poker-data:/app/data

  frontend:
    build: ./frontend
    depends_on:
      - backend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"

volumes:
  poker-data:
